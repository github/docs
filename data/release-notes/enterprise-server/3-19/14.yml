date: '2026-11-03'
sections:
  security_fixes:
    - |
      **HIGH**: An attacker with an account and SSH access to a GitHub Enterprise Server instance could execute arbitrary commands in the context of the Git service (babeld), including disclosure of its environment secrets, by exploiting a use-after-free in its SSH session handling to obtain a controlled write. Exploitation requires build-specific memory offsets, and unsuccessful attempts terminate the babeld process. GitHub has requested CVE ID [CVE-2026-104608](https://www.cve.org/cverecord?id=CVE-2026-104608) for this vulnerability, which was reported via the [GitHub Bug Bounty program](https://bounty.github.com/).
    - |
      **HIGH**: An attacker with code execution inside a Dependabot updater container could write files to unauthorized repository paths, including GitHub Actions workflow files, if the Dependabot installation had the `workflows: write` permission. Depending on repository permissions and workflow configuration, an injected workflow could execute with access to GitHub Actions secrets. The initial fix for this issue was incomplete, leaving the vulnerability exploitable in some cases. This vulnerability is tracked as [CVE-2026-15343](https://www.cve.org/cverecord?id=CVE-2026-15343) and was reported via the [GitHub Bug Bounty program](https://bounty.github.com/).
    - |
      **MEDIUM**: An attacker with an account and SSH access to a GitHub Enterprise Server instance could cause the Git service (babeld) to read beyond the end of the session identifier when proving possession of a host key by re-keying the connection to an algorithm with a longer hash. The adjacent memory is incorporated into a signature returned to the client, from which a limited amount of process memory may be recoverable. GitHub has requested CVE ID [CVE-2026-118237](https://www.cve.org/cverecord?id=CVE-2026-118237) for this vulnerability, which was reported via the [GitHub Bug Bounty program](https://bounty.github.com/).
    - |
      **MEDIUM**: On instances with ChatOps configured, an unauthenticated attacker could delete stored Slack and Microsoft Teams ChatOps settings and credentials through cross-site request forgery if a signed-in Management Console operator visited attacker-controlled content. GitHub has requested CVE ID [CVE-2026-110288](https://www.cve.org/cverecord?id=CVE-2026-110288) for this vulnerability, which was reported via the [GitHub Bug Bounty program](https://bounty.github.com/).
    - |
      Upgraded the `babeld` container base image from Ubuntu Focal (20.04) to Noble (24.04) for continued security support.
    - |
      To mitigate [CVE-2026-98432](https://www.cve.org/CVERecord?id=CVE-2026-98432), a Linux kernel vulnerability in TCP connection handling, the appliance firewall now drops incoming IPv4 TCP SYN packets that carry IP options, and Multipath TCP (MPTCP) is disabled. A fixed kernel will be included in a future release.
    - |
      Security updates have been applied to Go, Node.js, Ruby, org-ruby, RDoc, CA certificates, OpenSSL, NSS, zlib, curl, and Ubuntu system packages across targeted main and bundled container images. The Go and certificate updates partially address [CVE-2026-111943](https://www.cve.org/CVERecord?id=CVE-2026-111943); remaining components will be updated in a future release. The Ruby updates include fixes for regular expression compiler issues associated with [CVE-2026-89078](https://www.cve.org/CVERecord?id=CVE-2026-89078), [CVE-2026-93577](https://www.cve.org/CVERecord?id=CVE-2026-93577), [CVE-2026-97229](https://www.cve.org/CVERecord?id=CVE-2026-97229), and [CVE-2026-110264](https://www.cve.org/CVERecord?id=CVE-2026-110264).
  bugs:
    - |
      For repositories that use Gradle, Dependabot version updates could fail to update Gradle wrapper files and return a `dependency_file_not_supported` error.
    - |
      After a failover, subsequent configuration runs could fail because restored cluster configuration files had incorrect permissions.
    - |
      After an upgrade using the universal hotpatch package, some UI assets were not updated and remained at their pre-upgrade versions.
    - |
      On instances using the new metrics stack, metrics collection ran continuously instead of at the configured interval. This used significantly more CPU than necessary, which could noticeably affect performance on smaller instances.
    - |
      Ignorable rsync failures could cause backups to exit early, leaving them incomplete.
    - |
      After a backup completed, {% data variables.product.prodname_enterprise_backup_service %} could leave the `.sync_in_progress` file on disk.
    - |
      Site administrators could create backups that silently omitted custom pre-receive hooks because {% data variables.product.prodname_enterprise_backup_service %} checked an invalid path.
    - |
      On instances with GitHub Actions enabled, cluster health checks could report an inaccurate MSSQL replication status. If the status query returned unexpected output, the health check agent could crash.
    - |
      Users could see a 500 error when viewing a pull request while review requests for a deleted team were being cleaned up.
    - |
      Users couldn’t revoke OAuth authorizations for GitHub Mobile, and the authorization remained in place.
    - |
      On instances with slow GitHub Advanced Security license-usage calculations, some security and license settings pages and the security-products statistics API could return errors when requests timed out.
    - |
      Repository network locks could be released unexpectedly when idle connections timed out, while clients continued to report that the locks were held.
    - |
      Large pushes containing merge commits could fail with a `commit_refs` error when repository rules evaluated pushed files.
    - |
      Jupyter notebooks failed to render embedded images on private and internal repositories.
    - |
      Users experienced delays publishing or downloading Maven, NuGet, and RubyGems packages using authenticated requests to GitHub Packages.
    - |
      `ghe-spokesctl lock` could continue to indicate that a repository lock was held after the underlying connection closed and the lock had been released. The command now detects unexpected lock-stream closure and exits with an error.
  changes:
    - |
      Logs from OpenTelemetry-related exporters are written to the `/var/log/otel-stack/` directory.
    - |
      Historical metrics remain available in the Management Console's legacy monitoring dashboards after the legacy metrics stack is disabled.
    - |
      Site administrators can mark a user as not deleted if the deletion process fails partway through.
  known_issues:
    - |
      During an upgrade of GitHub Enterprise Server, custom firewall rules are removed. If you use custom firewall rules, you must reapply them after upgrading.
    - |
      If the root site administrator is locked out of the Management Console after failed login attempts, the account does not unlock automatically after the defined lockout time. Someone with administrative SSH access to the instance must unlock the account using the administrative shell. For more information, see [AUTOTITLE](/admin/administering-your-instance/administering-your-instance-from-the-web-ui/troubleshooting-access-to-the-management-console#unlocking-the-root-site-administrator-account).
    - |
      {% data reusables.release-notes.large-adoc-files-issue %}
    - |
      Admin stats REST API endpoints may time out on appliances with many users or repositories. Retrying the request until data is returned is advised.
    - |
      When following the steps for [Replacing the primary database node](/admin/monitoring-and-managing-your-instance/configuring-clustering/replacing-a-cluster-node#replacing-the-primary-database-node-mysql-or-mysql-and-mssql), running `ghe-cluster-config-apply` might fail with errors. If this occurs, re-running `ghe-cluster-config-apply` is expected to succeed.
    - |
      Running a config apply as part of the steps for [Replacing a node in an emergency](/admin/monitoring-managing-and-updating-your-instance/configuring-clustering/replacing-a-cluster-node#replacing-a-node-in-an-emergency) may fail with errors if the node being replaced is still reachable. If this occurs, shut down the node and repeat the steps.
    - |
      {% data reusables.release-notes.2024-06-possible-frontend-5-minute-outage-during-hotpatch-upgrade %}
    - |
      When restoring data originally backed up from a 3.13 or greater appliance version, the Elasticsearch indices need to be reindexed before some of the data will show up. This happens via a scheduled job that runs on the first Saturday of each month. It can also be forced by running `/usr/local/share/enterprise/ghe-es-search-repair`.
    - |
      When enabling automatic update checks for the first time in the Management Console, the status is not dynamically reflected until the "Updates" page is reloaded.
    - |
      When restoring from a backup snapshot, a large number of `mapper_parsing_exception` errors may be displayed.
    - |
      When initializing a new GHES cluster, nodes with the `consul-server` role should be added to the cluster before adding additional nodes. Adding all nodes simultaneously creates a race condition between nomad server registration and nomad client registration.
    - |
      In a cluster, the host running restore requires access to the storage nodes via their private IPs.
    - |
      After a restore, existing outside collaborators cannot be added to repositories in a new organization. This issue can be resolved by running `/usr/local/share/enterprise/ghe-es-search-repair` on the appliance.
    - |
      After a geo-replica is promoted to be a primary by running `ghe-repl-promote`, the actions workflow of a repository does not have any suggested workflows.
    - |
      The setting to define private registries at the organization level for code scanning is only available if Dependabot is also enabled for the instance.
    - |
      After a restart, an instance can remain unavailable with "Starting..." displayed in the web interface. To recover, an administrator can connect using administrative SSH and rerun `ghe-config-apply`. This provides temporary recovery but does not prevent the issue from recurring. This issue is resolved in {% data variables.product.prodname_ghe_server %} 3.21.0 and later.
