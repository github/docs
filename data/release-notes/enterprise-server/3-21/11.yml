date: '2026-11-22'
sections:
  security_fixes:
    - |
      **CRITICAL**: {% data variables.product.github %} has updated Ruby to fix [several announced vulnerabilities](https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/). Where an update was not immediately possible, mitigations were introduced at the application level.
    - |
      **HIGH**: {% data variables.product.github %} mitigated CVE-2026-114938, a vulnerability in the Java runtime bundled with Elasticsearch, by configuring Elasticsearch to start with `-XX:UseAVX=2` on x86-64 appliances.
    - |
      **HIGH**: An unauthenticated attacker could cause a denial of service by sending crafted HTTP/2 traffic that crashed HAProxy. HAProxy has been updated to version 2.8.32.
    - |
      Grafana was updated to 12.4.15 to address security vulnerabilities.
    - |
      Packages have been updated to the latest security versions.
  bugs:
    - |
      Users could not sign in to {% data variables.product.prodname_ghe_server %} through SAML when their identity provider returned a NameID that differed from the stored mapping only by letter case or accent marks.
  known_issues:
    - |
      During an upgrade of {% data variables.product.prodname_ghe_server %}, custom firewall rules are removed. If you use custom firewall rules, you must reapply them after upgrading.
    - |
      If the root site administrator is locked out of the {% data variables.enterprise.management_console %} after failed login attempts, the account does not unlock automatically after the defined lockout time. Someone with administrative SSH access to the instance must unlock the account using the administrative shell. For more information, see [AUTOTITLE](/admin/administering-your-instance/administering-your-instance-from-the-web-ui/troubleshooting-access-to-the-management-console#unlocking-the-root-site-administrator-account).
    - |
      {% data reusables.release-notes.large-adoc-files-issue %}
    - |
      Admin stats REST API endpoints may time out on appliances with many users or repositories. Retrying the request until data is returned is advised.
    - |
      When following the steps for [AUTOTITLE](/admin/monitoring-and-managing-your-instance/configuring-clustering/replacing-a-cluster-node#replacing-the-primary-database-node-mysql-or-mysql-and-mssql), running `ghe-cluster-config-apply` might fail with errors. If this occurs, re-running `ghe-cluster-config-apply` is expected to succeed.
    - |
      Running a config apply as part of the steps for [Replacing a node in an emergency](/admin/monitoring-and-managing-your-instance/configuring-clustering/replacing-a-cluster-node#replacing-a-node-in-an-emergency) may fail with errors if the node being replaced is still reachable. If this occurs, shut down the node and repeat the steps.
    - |
      When restoring data originally backed up from a 3.13 or greater appliance version, the Elasticsearch indices need to be reindexed before some of the data will show up. This happens via a scheduled job that runs on the first Saturday of each month. It can also be forced by running `/usr/local/share/enterprise/ghe-es-search-repair`.
    - |
      When initializing a new GHES cluster, nodes with the `consul-server` role should be added to the cluster before adding additional nodes. Adding all nodes simultaneously creates a race condition between nomad server registration and nomad client registration.
    - |
      In a cluster, the host running restore requires access to the storage nodes via their private IPs.
    - |
      After a restore, existing outside collaborators cannot be added to repositories in a new organization. This issue can be resolved by running `/usr/local/share/enterprise/ghe-es-search-repair` on the appliance.
    - |
      After a geo-replica is promoted to be a primary by running `ghe-repl-promote`, the actions workflow of a repository does not have any suggested workflows.
    - |
      On instances with multiple Git storage nodes in a voting configuration, including cluster and geo-replication high availability topologies, upgrading may fail to correctly install Actions that ship with the new version. In some cases, previous versions of these Actions remain on the instance. To resolve this issue, run the following commands on the primary node: `ghe-config --unset 'app.actions.actions-repos-sha1sum'`, `ghe-config-apply`, and `/usr/local/share/enterprise/ghe-run-init-actions-graph`.
    - |
      When an administrator restores a backup with `ghe-restore` to a configured standalone instance with Replication Controller enabled, `ghe-restore` may skip storage data, such as avatars and attachments, and still complete successfully. The restore output includes `Warning: no routes found, skipping storage restore ...`. If you see this warning or storage data is missing after a restore, contact {% data variables.contact.github_support %}.
    - |
      `ghe-storage-extend` will fail for disks with a sector size greater than 1KiB, most notably with Azure Premium SSD v2 disks. This is due to an upstream bug with `resize2fs` when resizing a mounted disk.
