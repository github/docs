# Permissions for each repository role, rendered by:
# content/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization.md
#
# 'roles' lists the roles that CAN perform the action. Roles left out render as no.
# 'roles' and 'versions' may contain Liquid; it is rendered via the render_liquid filter.
# 'versions' shows the row only when it renders non-empty.

permissions:
  - action: 'Manage [individual](/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/managing-an-individuals-access-to-an-organization-repository), [team](/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/managing-team-access-to-an-organization-repository), and [outside collaborator](/organizations/managing-user-access-to-your-organizations-repositories/managing-outside-collaborators/adding-outside-collaborators-to-repositories-in-your-organization) access to the repository'
    roles: 'admin'

  - action: "Pull from the person or team's assigned repositories"
    roles: 'read, triage, write, maintain, admin'

  - action: "Fork the person or team's assigned repositories"
    roles: 'read, triage, write, maintain, admin'

  - action: 'Edit and delete their own comments'
    roles: 'read, triage, write, maintain, admin'

  - action: 'Open issues'
    roles: 'read, triage, write, maintain, admin'

  - action: 'Close issues they opened themselves'
    roles: 'read, triage, write, maintain, admin'

  - action: 'Reopen issues they closed themselves'
    roles: 'read, triage, write, maintain, admin'

  - action: 'Have an issue assigned to them'
    roles: 'read, triage, write, maintain, admin'

  - action: "Send pull requests from forks of the team's assigned repositories"
    roles: 'read, triage, write, maintain, admin'

  - action: '[Submit reviews on pull requests](/pull-requests/how-tos/review-pull-requests/reviewing-proposed-changes-in-a-pull-request)'
    roles: 'read, triage, write, maintain, admin'

  - action: '[Approve or request changes to a pull request with required reviews](/pull-requests/how-tos/review-pull-requests/approving-a-pull-request-with-required-reviews)'
    roles: 'write, maintain, admin'

  - action: '[Apply suggested changes](/pull-requests/how-tos/review-pull-requests/incorporating-feedback-in-your-pull-request) to pull requests'
    roles: 'write, maintain, admin'

  - action: 'View published releases'
    roles: 'read, triage, write, maintain, admin'

  - action: 'View [{% data variables.product.prodname_actions %} workflow runs](/actions/how-tos/manage-workflow-runs)'
