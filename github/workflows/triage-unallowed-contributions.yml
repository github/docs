name: Check unallowed file changes

# Blocks public pull requests that change files managed only in docs-internal.

on:
  # pull_request_target lets PRs from forks receive unallowed-change comments.
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    if: >-
      ${{
        github.repository == 'github/docs' &&
        github.event.pull_request.user.login != 'docs-bot' &&
        github.event.pull_request.user.login != 'dependabot[bot]'
        && !contains(github.event.pull_request.labels.*.name, 'skip-unallowed-check')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # Compare against main to match the public docs repo base.
          base: 'main'

          # list-files=json emits matching paths in FILTER_NAME_files outputs.
          list-files: json

          filters: 'src/workflows/unallowed-contribution-filters.yml'

      - name: Set up Node and dependencies
        if: ${{ steps.filter.outputs.notAllowed == 'true' || steps.filter.outputs.contentTypes == 'true' }}
        uses: ./.github/actions/node-npm-setup

      # Comment when rejected file changes will close the PR, so the author knows why.
      - name: "Comment about changes we can't accept"
        if: ${{ steps.filter.outputs.notAllowed == 'true' || steps.filter.outputs.contentTypes == 'true' }}
        run: npm run unallowed-contributions
        env:
          REPO_OWNER_AND_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          FILE_PATHS_NOT_ALLOWED: ${{ steps.filter.outputs.notAllowed_files }}
          CHANGED_FILE_PATHS: ${{ steps.filter.outputs.contentTypes_files }}
          ADDED_CONTENT_FILES: ${{ steps.filter.outputs.added_files }}
          GITHUB_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}
