# Content pipelines sync source docs into allowed target articles with the
# content-pipeline-update agent.
#
# Run a pipeline manually with:
#   npx tsx src/content-pipelines/scripts/update.ts --id copilot-cli
#
# The workflow matrix entry needs only id.
# Later workflow steps and update.ts read the other fields from this file.
# exclusions lists source topics the agent skips during gap analysis.
# Use [] when none.
# Example:
# exclusions:
#   - Internal debugging commands
#   - Experimental telemetry flags
#
copilot-cli:
  name: Copilot CLI
  source-repo: github/copilot-cli-generated-docs
  source-path: docs
  target-articles:
    - content/copilot/reference/copilot-cli-reference/cli-command-reference.md
    - content/copilot/reference/copilot-cli-reference/cli-plugin-reference.md
    - content/copilot/reference/copilot-cli-reference/cli-programmatic-reference.md
    - content/copilot/reference/copilot-cli-reference/acp-server.md
    - content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md
    - content/copilot/reference/github-copilot-app-reference/slash-commands.md
    - content/copilot/reference/hooks-reference.md
    - content/copilot/reference/enterprise-administrators/enterprise-managed-settings.md
    - content/copilot/reference/enterprise-administrators/opentelemetry-reference.md
  exclusions:
    - All mentions of, or information directly relating to, feature flags
    - enabledFeatureFlags configuration setting
    - COPILOT_CLI_ENABLED_FEATURE_FLAGS environment variable
    - OpenTelemetry monitoring details from docs/reference/monitoring.md are excluded from CLI reference articles, except default-off state and activation conditions in cli-command-reference.md. Detailed OpenTelemetry configuration, variable tables, authentication headers, traces, metrics, span events, resource attributes, and content capture belong in content/copilot/reference/enterprise-administrators/opentelemetry-reference.md; CLI-specific configuration-file details belong in content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md.
  content-mapping: |
    content/copilot/reference/copilot-cli-reference/cli-plugin-reference.md covers only plugin-specific content.
    content/copilot/reference/github-copilot-app-reference/slash-commands.md relates to the Copilot App specifically, not Copilot CLI.
    In content/copilot/reference/enterprise-administrators/enterprise-managed-settings.md: only update information relating to Copilot CLI.
    Preserve existing client and harness applicability labels. Do not remove the distinction from VS Code's Local agent harness or use CLI source documentation to infer behavior for other clients or harnesses.
    All information relating to files in the ~/.copilot configuration directory, and settings in those files, should go in content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md.
    All reference details relating to hooks should go in content/copilot/reference/hooks-reference.md.
    All reference details relating to using Copilot CLI programmatically (e.g. command line options and environment variables) should go in content/copilot/reference/copilot-cli-referencecli-programmatic-reference.md. Tabular information (but not discursive explanatory text) about using the CLI programmatically should also go in the main content/copilot/reference/copilot-cli-reference/cli-command-reference.md article.
    In the "OpenTelemetry monitoring" section in cli-command-reference.md, maintain the default off state and activation conditions (COPILOT_OTEL_ENABLED=true, OTEL_EXPORTER_OTLP_ENDPOINT set, or COPILOT_OTEL_FILE_EXPORTER_PATH set). Preserve the link to /copilot/reference/enterprise-administrators/opentelemetry-reference. Do not add the detailed monitoring reference or environment variable tables to any target article.
    Keep telemetry reference links in enterprise-managed-settings.md and cli-config-dir-reference.md pointing to /copilot/reference/enterprise-administrators/opentelemetry-reference, not to the CLI command reference.
    All other non-excluded CLI topics (MCP, skills, agents, permissions, etc.) belong in content/copilot/reference/copilot-cli-reference/cli-command-reference.md even when they mention plugins.

gh-stack:
  name: gh stack CLI
  source-repo: github/gh-stack
  source-path: docs/src/content/docs/reference
  target-articles:
    - content/pull-requests/reference/stacked-prs-cli-commands.md
  exclusions:
    - Webhook payloads and webhook event reference (webhooks.md). Webhook events and payloads are generated on GitHub Docs from the webhook schemas, not by this pipeline. See /webhooks/webhook-events-and-payloads.
    - REST API endpoint reference (rest-api.md). REST reference content is generated on GitHub Docs from the OpenAPI description, not by this pipeline.
    - GraphQL API reference, including queries, mutations, and types (graphql-api.md). GraphQL reference content is generated on GitHub Docs from the GraphQL schema, not by this pipeline. See /graphql/reference/objects.
    - Merge API reference, including the asynchronous merge endpoints (merge-api.md). REST endpoint reference is owned outside this pipeline.
  content-mapping: |
    The target article has a "Command summary" table near the top listing every gh stack command as an anchor link. The site's automatic table of contents only shows "##" headings, so this table is the only way readers can navigate to an individual command. Whenever you add, rename, remove, or re-scope a "###" command section, you MUST update the matching table row in the same edit, keeping row order aligned with section order and anchors correct. Leaving them out of sync is a defect.
    The source is an Astro Starlight site. Convert directives to GitHub Docs alerts: ":::note" becomes "> [!NOTE]", ":::tip" becomes "> [!TIP]", ":::caution" becomes "> [!WARNING]", ":::danger" becomes "> [!CAUTION]". Drop directive titles such as ":::note[Authentication]", because GitHub Docs alerts do not take titles.
    The source uses "sh" code fences and title-case headings; use "shell" and sentence case instead.
    Write "pull request" rather than "PR".
