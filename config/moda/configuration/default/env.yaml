data:
  MODA_APP_NAME: docs-internal
  NODE_ENV: production
  # Match the Dockerfile heap limit so config-layering order cannot change it.
  NODE_OPTIONS: '--max-old-space-size-percentage=80'
  PORT: '4000'
  ENABLED_LANGUAGES: 'en,es,ja,pt,zh,ru,fr,ko,de'
  RATE_LIMIT_MAX: '21'
  # Moda sends Datadog metrics on a non-default port.
  DD_DOGSTATSD_PORT: '28125'
  # NodeSDK enables OTLP metrics and logs exporters when these env vars are unset.
  # Only traces are wanted, so disable the others to avoid export errors.
  # See https://opentelemetry.io/docs/specs/otel/protocol/exporter/
  OTEL_METRICS_EXPORTER: 'none'
  OTEL_LOGS_EXPORTER: 'none'
  # The traces endpoint is set per environment in production/env.yaml.
  # Staging omits OTEL_EXPORTER_OTLP_TRACES_ENDPOINT and trace headers.
  # tracing.ts skips SDK startup without the endpoint env var.
