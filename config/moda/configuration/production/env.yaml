data:
  MODA_APP_NAME: docs-internal
  NODE_ENV: production
  # Match the Dockerfile heap limit so config-layering order cannot change it.
  NODE_OPTIONS: '--max-old-space-size-percentage=80'
  PORT: '4000'
  ENABLED_LANGUAGES: 'en,es,ja,pt,zh,ru,fr,ko,de'
  RATE_LIMIT_MAX: '21'
  # Moda sends Datadog metrics on a non-default port.
  DD_DOGSTATSD_PORT: '28125'
  # Marks the service deployment environment as production.
  # Equivalent to HEAVEN_DEPLOYED_ENV === 'production'.
  MODA_PROD_SERVICE_ENV: 'true'
  # Send production traces to the OTel Collector through OTLP over HTTP.
  # Use %site%, not %stamp%, because docs-internal lacks service-mesh and Proxima routing.
  # Cluster routing is region iad and profile general.
  # %site% resolves to the cluster site, such as iad, in otelcol.service.iad.github.net.
  # https://thehub.github.com/epd/engineering/dev-practicals/observability/distributed-tracing/instrumentation/
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: 'https://otelcol.service.%site%.github.net/v1/traces'
