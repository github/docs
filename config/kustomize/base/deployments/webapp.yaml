# Shared by every environment. Staging and review labs use these replica and resource values as is.
# Production overrides replicas, rollout strategy, and resources in
# config/kustomize/overlays/production/deployments/webapp.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  annotations:
    moda.github.net/inject-unified-service-tag-env-var: docs-internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
      annotations:
        # Use logfmt_sloppy because internal logs write unstructured stdout and stderr.
        # https://thehub.github.com/epd/engineering/dev-practicals/observability/logging/
        fluentbit.io/parser: logfmt_sloppy
        observability.github.com/splunk_index: docs-internal
        # Overlays replace the env tag for production and review labs.
        ad.datadoghq.com/webapp.logs: '[{"source":"nodejs","service":"docs-internal","tags":["env:staging"]}]'
        ad.datadoghq.com/tolerate-unready: 'true'
    spec:
      dnsPolicy: Default
      # This 60-second total covers preStop, then request drain and OTEL shutdown after SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: webapp
          image: docs-internal
          # Staging values. Retune using 2 weeks of data:
          # https://app.datadoghq.com/dashboard/6vx-iun-ghs/moda-resource-recommendations?tpl_var_kube_namespace%5B0%5D=docs-internal-staging-balsam&tpl_var_kube_namespace%5B1%5D=docs-internal-staging-boxwood&tpl_var_kube_namespace%5B2%5D=docs-internal-staging-cedar&tpl_var_kube_namespace%5B3%5D=docs-internal-staging-cypress&tpl_var_kube_namespace%5B4%5D=docs-internal-staging-fir&tpl_var_kube_namespace%5B5%5D=docs-internal-staging-hemlock&tpl_var_kube_namespace%5B6%5D=docs-internal-staging-hinoki&tpl_var_kube_namespace%5B7%5D=docs-internal-staging-holly&tpl_var_kube_namespace%5B8%5D=docs-internal-staging-juniper&tpl_var_kube_namespace%5B9%5D=docs-internal-staging-laurel&tpl_var_kube_namespace%5B10%5D=docs-internal-staging-pine&tpl_var_kube_namespace%5B11%5D=docs-internal-staging-redwood&tpl_var_kube_namespace%5B12%5D=docs-internal-staging-sequoia&tpl_var_kube_namespace%5B13%5D=docs-internal-staging-spruce&tpl_var_kube_namespace%5B14%5D=docs-internal-staging-yew&from_ts=0&to_ts=1209600000&live=true
          # Staging is not budget checked.
          resources:
            requests:
              # requests.cpu: 150m idle schedule floor because staging idles near zero.
              cpu: 150m
              # requests.memory: highest-peak pod p99 (1882Mi) * 1.1 for working-set padding.
              memory: 2070Mi
            limits:
              # limits.cpu: highest warmup peak (1.82 cores) * 3 for startup headroom.
              cpu: 5460m
              # limits.memory: highest-peak pod max (1882Mi) * 2.
              # Over the limit means OOMKill; memory is not compressible.
              memory: 3764Mi
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: vault-secrets
            - configMapRef:
                name: kube-cluster-metadata
            # Moda creates application-config from config/moda/configuration/*/env.yaml.
            - configMapRef:
                name: application-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Sleep before shutdown so Moda drains connections before old pods exit.
          # https://thehub.github.com/engineering/products-and-services/internal/moda/feature-documentation/pod-lifecycle/#required-prestop-hook
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          # warmServer() loads about 3500 content files × 9 languages × 9 versions.
          # Startup averages 25 seconds and peaked at 48 seconds in Datadog docs.warm_server.
          # The server starts listening after warmup, so probes fail at TCP level during boot.
          # No app-level readiness flag is needed.
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            # Avoid probes during the average 25-second warmup.
            initialDelaySeconds: 30
            periodSeconds: 5
            # Total runway: 30s + 30 × 5s = 180s.
            # Covers peak startup plus resource contention when multiple pods boot during a deploy.
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            # 5 × 10s = 50s before the pod leaves the load balancer.
            # The healthcheck always returns 200, so failures mean the process is hung or under extreme pressure.
            failureThreshold: 5
            timeoutSeconds: 5
          # Skip livenessProbe because healthcheck returns 200 unless the process is fully hung.
          # Readiness removes hung pods from load balancing.
          # Liveness restarts risk killing pods during GC pauses or transient load spikes.
