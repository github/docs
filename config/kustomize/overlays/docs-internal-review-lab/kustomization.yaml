apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - services/router.yaml
  - ingresses/http.yaml

patches:
  - target:
      kind: Deployment
      name: webapp
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: webapp
      spec:
        template:
          metadata:
            annotations:
              ad.datadoghq.com/webapp.logs: '[{"source":"nodejs","service":"docs-internal","tags":["env:docs-internal-review-lab"]}]'
  - target:
      kind: Service
      name: webapp
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: webapp
      $patch: delete
