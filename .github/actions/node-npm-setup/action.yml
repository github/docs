name: Node set up composite

description: Will set up Node and install all packages by caching node_modules

runs:
  using: 'composite'
  steps:
    - name: Cache node_modules
      uses: actions/cache@v6
      id: cache-node_modules
      env:
        # Cache restore failures are acceptable, so keep the segment timeout short.
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        path: node_modules
        # The postinstall script applies patches/ during npm ci, so patch changes must miss the cache.
        key: ${{ runner.os }}-node_modules-${{ hashFiles('package*.json', 'patches/**') }}-${{ hashFiles('.github/actions/node-npm-setup/action.yml') }}

    # The npm download cache only helps npm ci, so skip its 153 MB restore when node_modules hits.
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
        package-manager-cache: false
        cache: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' && 'npm' || '' }}

    - name: Install dependencies
      if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci
