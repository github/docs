# Based on Next.js CI build cache guidance:
# https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching#github-actions

name: Cache Nextjs build cache

description: Cache the .next/cache according to best practices

runs:
  using: 'composite'
  steps:
    - name: Cache .next/cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.next/cache
        # Packages and source files both invalidate the cache.
        # Use narrow globs: `**` walks node_modules and translations and takes about 35s per hash.
        key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', '*.ts') }}
        # With matching restore-key prefixes, source-only changes restore the same-package cache.
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
