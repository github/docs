name: Check for Spammy Issues

# Closes low-value public issues so spam does not stay open in github/docs.

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  spammy-title-check:
    name: Remove issues with spammy titles
    if: github.repository == 'github/docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.DOCS_BOT_PAT_BASE }}
          script: |

            const issue = context.payload.issue
            const owner = 'github'
            const repo = 'docs'

            const titleWordCount = issue.title.trim().split(' ').length
            const titleWordCountMin = 3
            const urlRegex = /https?:\/\/\S+/i
            const titleHasUrl = urlRegex.test(issue.title)
            const titleHasDollarSign = issue.title.includes('$')

            try {
              await github.rest.teams.getMembershipForUserInOrg({
                org: 'github',
                team_slug: 'employees',
                username: context.payload.sender.login,
              });

              // Skip GitHub employees so legitimate internal reports stay open.
              return
            } catch (err) {
              // The membership lookup throws for non-employees, so fall through to title checks.
              if (titleWordCount >= titleWordCountMin && !titleHasUrl && !titleHasDollarSign) {
                return
              }
            }

            await github.rest.issues.update({
              owner: owner,
              repo: repo,
              issue_number: issue.number,
              labels: ['invalid'],
              state: 'closed'
            });

            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issue.number,
              body: `This issue may have been opened accidentally. I'm going to close it now, but feel free to open a new issue with a more descriptive title! Make sure not to include full URLs in your issue titles, and use paths instead.`
            });

            try {
              await github.rest.projects.createCard({
                column_id: 11167427,
                content_id: context.payload.issue.id,
                content_type: "Issue"
              });
            } catch (error) {
              console.log(error);
            }
