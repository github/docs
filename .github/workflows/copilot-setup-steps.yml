name: 'Copilot Setup Steps'

# Copilot cloud agents run this special-name workflow before work; workflow_dispatch tests it without push or PR runs.
# Related agent instructions live in .github/instructions/.

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    if: github.repository == 'github/docs-internal' || github.repository == 'github/docs'
    permissions:
      contents: read
      id-token: write
    env:
      ELASTICSEARCH_URL: http://localhost:9200/
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/node-npm-setup

      # Search and language test suites require local Elasticsearch.
      - uses: ./.github/actions/setup-elasticsearch
        with:
          token: ${{ secrets.DOCS_BOT_PAT_BASE }}

      # Fetch early-access content separately because docs-internal does not include it.
      - uses: ./.github/actions/get-docs-early-access
        if: ${{ github.repository == 'github/docs-internal' }}
        with:
          token: ${{ secrets.DOCS_BOT_PAT_BASE }}

      # Many test suites depend on Next.js build artifacts.
      - name: Build
        run: npm run build

      # Set ELASTICSEARCH_URL inline because agent runtimes ignore workflow env blocks.
      # Command-level env works in agent sessions and manual test runs.
      - name: Index fixtures into the local Elasticsearch
        run: ELASTICSEARCH_URL=http://localhost:9200/ npm run index-test-fixtures
