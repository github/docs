name: Enterprise date updater

# Keep src/ghes-releases/lib/enterprise-dates.json current for deprecation banner dates
# and historical GitHub Enterprise Server release references.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 16 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  open_enterprise_issue:
    name: Enterprise date updater
    if: github.repository == 'github/docs-internal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/node-npm-setup

      - name: Run src/ghes-releases/scripts/update-enterprise-dates.ts
        run: npm run update-enterprise-dates
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # pin @v8.0.0
        env:
          # Create-pull-request runs git commands itself, so disable hooks that can
          # change the worktree.
          HUSKY: '0'
        with:
          # This PR update requires repo and workflow scopes.
          token: ${{ secrets.DOCS_BOT_PAT_BASE }}
          commit-message: '🤖 ran src/ghes-releases/scripts/update-enterprise-dates.ts'
          title: 🤖 src/ghes-releases/lib/enterprise-dates.json update
          body:
            "Hello! The GitHub Enterprise Server release dates have changed.\n\n
            If CI passes, this PR will be auto-merged. :green_heart:\n\n
            If CI does not pass or other problems arise, contact #technical-content on slack.\n\nThis PR was 🤖-crafted by `.github/workflows/enterprise-dates.yml`. 🧶"
          branch: enterprise-server-dates-update
          delete-branch: true

      - name: Enable GitHub auto-merge
        if: ${{ steps.create-pull-request.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}
          AUTOMERGE_PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: npm run enable-automerge

      - if: ${{ failure() }}
        name: Delete remote branch (if previous steps failed)
        run: git push origin --delete enterprise-server-dates-update

      - if: ${{ steps.create-pull-request.outputs.pull-request-number }}
        name: Approve
        uses: juliangruber/approve-pull-request-action@68fcc9a5a73b5641cadf757cf99d73720dcb05d0 # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.create-pull-request.outputs.pull-request-number }}

      - uses: ./.github/actions/create-workflow-failure-issue
        id: create-failure-issue
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        with:
          token: ${{ secrets.DOCS_BOT_PAT_BASE }}

      - uses: ./.github/actions/slack-alert
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        with:
          slack_token: ${{ secrets.SLACK_DOCS_BOT_TOKEN }}
          issue_url: ${{ steps.create-failure-issue.outputs.issue_url }}
