name: Comment on adding "needs SME" label

# Public issues and PRs labeled needs SME get an automated comment for subject matter expert review.

on:
  issues:
    types: [labeled]
  # pull_request_target lets forked PRs receive the triage comment.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  add-issue-comment:
    if: ${{ github.repository == 'github/docs' && (github.event.label.name == 'needs SME' && github.event_name == 'issues') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening an issue! We've triaged this issue for technical review by a subject matter expert :eyes:

      - uses: ./.github/actions/slack-alert
        if: ${{ failure() && github.event_name != 'pull_request_target' }}
        with:
          slack_token: ${{ secrets.SLACK_DOCS_BOT_TOKEN }}

  add-pr-comment:
    if: ${{ github.repository == 'github/docs' && (github.event.label.name == 'needs SME' && github.event_name == 'pull_request_target') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Thanks for opening a pull request! We've triaged this issue for technical review by a subject matter expert :eyes:

      - uses: ./.github/actions/slack-alert
        if: ${{ failure() && github.event_name != 'pull_request_target' }}
        with:
          slack_token: ${{ secrets.SLACK_DOCS_BOT_TOKEN }}
