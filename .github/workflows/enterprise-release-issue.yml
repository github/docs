name: Open Enterprise release or deprecation issue

# GHES releases and deprecations follow a predictable schedule, so this workflow opens
# their planning issues automatically.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 16 * * 1'

permissions:
  contents: read

jobs:
  open_enterprise_issue:
    name: Open Enterprise issue
    if: github.repository == 'github/docs-internal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/node-npm-setup

      - name: Create an enterprise release issue
        run: npm run create-enterprise-issue -- release
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}

      - name: Create an enterprise deprecation issue
        run: npm run create-enterprise-issue -- deprecation
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}

      - uses: ./.github/actions/create-workflow-failure-issue
        id: create-failure-issue
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        with:
          token: ${{ secrets.DOCS_BOT_PAT_BASE }}

      - uses: ./.github/actions/slack-alert
        if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
        with:
          slack_token: ${{ secrets.SLACK_DOCS_BOT_TOKEN }}
          issue_url: ${{ steps.create-failure-issue.outputs.issue_url }}
