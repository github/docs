name: Close issue/PR on adding invalid label

# Closes public issues and PRs when the invalid label is added.
# Re-closes invalid PRs that someone without write access reopens.

on:
  issues:
    types: [labeled]
  # pull_request_target lets the workflow close forked PRs when they're labeled invalid or reopened.
  pull_request_target:
    types: [labeled, reopened]

permissions:
  contents: read

jobs:
  close-on-adding-invalid-label:
    if: github.repository == 'github/docs' && github.event.label.name == 'invalid'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Close issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL"

      - name: Close PR
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr close "$PR_URL"

      - name: Check out repo
        if: ${{ failure() && github.event_name != 'pull_request_target' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/slack-alert
        if: ${{ failure() && github.event_name != 'pull_request_target' }}
        with:
          slack_token: ${{ secrets.SLACK_DOCS_BOT_TOKEN }}

  # Authors can reopen PRs they closed themselves, even after the invalid label is added.
  reclose-reopened-invalid-pr:
    if: >
      github.repository == 'github/docs' && github.event_name == 'pull_request_target' &&
      github.event.action == 'reopened' &&
      contains(github.event.pull_request.labels.*.name, 'invalid')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Re-close PR unless reopened by someone with write access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if ! permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq '.permission'); then
            echo "::warning::Couldn't look up permission for $SENDER, so treating them as read-only."
            permission=none
          fi
          if [[ "$permission" == "admin" || "$permission" == "write" ]]; then
            echo "$SENDER has $permission access, so leaving the PR open."
            exit 0
          fi
          gh pr close "$PR_URL" --comment 'This pull request is labeled `invalid`, so only maintainers can reopen it. If you think this is incorrect, please mention this in a corresponding issue.'
