name: Reviewers - Dependabot

# Dependabot docs paths request dependabot-updates-reviewers
# so maintainers see relevant PRs.

on:
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'data/reusables/dependabot/**'
      - 'data/reusables/**/*dependabot*'
      - 'content/code-security/**/*dependabot*'
      - 'content/code-security/**/*dependabot*/**'
      # Dependabot articles whose paths do not contain "dependabot"
      - 'content/code-security/concepts/supply-chain-security/malware-alerts.md'
      - 'content/code-security/concepts/supply-chain-security/multi-ecosystem-updates.md'
      - 'content/code-security/how-tos/secure-at-scale/configure-enterprise-security/configure-specific-tools/configure-limited-internet-access.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-access-to-private-registries.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-on-github-hosted-runners.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-on-self-hosted-runners.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-private-registries.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/controlling-dependencies-updated.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/list-configured-dependencies.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/prioritize-with-preset-rules.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/remove-access-to-public-registries.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/resolve-a-blocked-host.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/auto-update-actions.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-malware-alerts.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-security-updates.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates.md'
      - 'content/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates.md'
      - 'content/code-security/reference/supply-chain-security/criteria-for-preset-rules.md'
      - 'content/code-security/reference/supply-chain-security/supported-ecosystems-and-manifests-for-dependency-scope.md'
      - 'content/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories.md'
      - 'content/code-security/tutorials/secure-your-dependencies/optimizing-pr-creation-version-updates.md'
      - 'content/rest/dependabot/**'
      - '.github/workflows/reviewers-dependabot.yml'

permissions:
  contents: read
  pull-requests: write
  repository-projects: read

jobs:
  reviewers-dependabot:
    if: >-
      ${{ github.repository == 'github/docs-internal' &&
          !github.event.pull_request.draft &&
          !contains(github.event.pull_request.labels.*.name, 'reviewers-dependabot') &&
          github.event.pull_request.head.ref != 'repo-sync' }}
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.html_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add dependabot as a reviewer
        env:
          GH_TOKEN: ${{ secrets.DOCS_BOT_PAT_BASE }}
        uses: ./.github/actions/retry-command
        with:
          command: gh pr edit $PR --add-reviewer github/dependabot-updates-reviewers --add-label reviewers-dependabot
